<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variedades Elizabeth | Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-subtle { animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <!-- HEADER / NAVEGACIÓN -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-pink-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-pink-500 text-white flex items-center justify-center font-bold text-xl shadow-md">
                    VE
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-gray-900">Variedades Elizabeth</h1>
                    <p class="text-xs text-pink-600 font-medium">Catálogo en Vivo</p>
                </div>
            </div>

            <!-- Botón Carrito Mobile/Desktop -->
            <button onclick="toggleCartModal()" class="relative bg-pink-50 hover:bg-pink-100 text-pink-600 px-4 py-2 rounded-full flex items-center gap-2 font-semibold transition-all">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span class="hidden sm:inline">Mi Pedido</span>
                <span id="cart-count" class="bg-pink-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>
    </header>

    <!-- BANNER Y CONTROLES -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
        <!-- Buscador y Filtros -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-6 space-y-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-input" oninput="applyFilters()" placeholder="Buscar prendas, calzado, accesorios..." 
                    class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:border-pink-500 focus:ring-2 focus:ring-pink-200 outline-none transition-all text-sm">
            </div>

            <div class="flex flex-wrap gap-2 items-center justify-between">
                <!-- Categorías -->
                <div class="flex gap-2 overflow-x-auto no-scrollbar py-1 w-full sm:w-auto" id="category-pills">
                    <button onclick="setCategory('ALL')" class="cat-pill active px-4 py-1.5 rounded-full text-xs font-bold bg-pink-500 text-white whitespace-nowrap transition-all">Todas</button>
                </div>

                <!-- Ordenamiento -->
                <select id="sort-select" onchange="applyFilters()" class="bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded-xl px-3 py-2 outline-none focus:border-pink-500">
                    <option value="default">Ordenar por: Relevancia</option>
                    <option value="price-asc">Precio: Menor a Mayor</option>
                    <option value="price-desc">Precio: Mayor a Menor</option>
                    <option value="stock-desc">Mayor Disponibilidad</option>
                </select>
            </div>
        </div>

        <!-- GRID DE PRODUCTOS -->
        <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            <!-- Skeleton Loading -->
            <div class="bg-white rounded-2xl p-3 border border-gray-100 animate-pulse space-y-3">
                <div class="bg-gray-200 h-44 rounded-xl"></div>
                <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
            </div>
            <div class="bg-white rounded-2xl p-3 border border-gray-100 animate-pulse space-y-3">
                <div class="bg-gray-200 h-44 rounded-xl"></div>
                <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
            </div>
        </div>

        <div id="no-results" class="hidden text-center py-12">
            <i class="fa-solid fa-box-open text-4xl text-gray-300 mb-3"></i>
            <p class="text-gray-500 font-medium">No se encontraron productos con estos criterios.</p>
        </div>
    </main>

    <!-- MODAL DETALLE DE PRODUCTO (CARRUSEL DE HASTA 5 FOTOS) -->
    <div id="product-modal" class="fixed inset-0 bg-black/60 z-50 hidden backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl relative max-h-[90vh] flex flex-col">
            <button onclick="closeProductModal()" class="absolute right-4 top-4 z-10 bg-white/80 hover:bg-white text-gray-700 w-8 h-8 rounded-full flex items-center justify-center shadow transition-all">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="overflow-y-auto p-6 space-y-4">
                <!-- Visualizador de Imagen / Carrusel -->
                <div class="relative bg-gray-100 rounded-2xl overflow-hidden aspect-square flex items-center justify-center">
                    <img id="modal-main-image" src="" alt="" class="w-full h-full object-contain">
                    <span id="modal-badge" class="absolute top-3 left-3 px-3 py-1 rounded-full text-xs font-bold text-white shadow-sm"></span>
                </div>

                <!-- Miniaturas (Hasta 5 Fotos) -->
                <div id="modal-thumbnails" class="flex gap-2 overflow-x-auto py-1"></div>

                <!-- Info Producto -->
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span id="modal-cat" class="text-xs font-bold uppercase tracking-wider text-pink-600 bg-pink-50 px-2 py-0.5 rounded-md"></span>
                        <span id="modal-subcat" class="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded-md"></span>
                    </div>
                    <h3 id="modal-title" class="text-xl font-bold text-gray-900"></h3>
                    <p id="modal-stock" class="text-xs font-semibold mt-1"></p>
                </div>

                <div class="flex items-baseline gap-3">
                    <span id="modal-price" class="text-2xl font-black text-pink-600"></span>
                    <span id="modal-old-price" class="text-sm text-gray-400 line-through"></span>
                </div>

                <div>
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Descripción</h4>
                    <p id="modal-desc" class="text-sm text-gray-600 leading-relaxed"></p>
                </div>

                <button id="modal-add-btn" onclick="" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-pink-200 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cart-plus"></i> Agregar al Carrito
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL CARRITO / CHECKOUT WHATSAPP -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping text-pink-500"></i> Mi Pedido
                </h3>
                <button onclick="toggleCartModal()" class="text-gray-400 hover:text-gray-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="cart-items" class="p-4 overflow-y-auto flex-grow space-y-3 divide-y divide-gray-100">
                <!-- Se llena dinámicamente -->
            </div>

            <div class="p-4 bg-gray-50 border-t border-gray-100 space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-500">Subtotal:</span>
                    <span id="cart-total" class="font-bold text-lg text-gray-900">Q0.00</span>
                </div>

                <!-- Formulario Datos de Envío -->
                <div class="space-y-2 pt-2">
                    <input type="text" id="client-name" placeholder="Tu Nombre Completo" class="w-full text-xs p-2.5 rounded-lg border border-gray-200 outline-none focus:border-pink-500">
                    <select id="client-zone" class="w-full text-xs p-2.5 rounded-lg border border-gray-200 outline-none focus:border-pink-500">
                        <option value="San Juan Sacatepéquez">San Juan Sacatepéquez (Centro / Parque)</option>
                        <option value="San Pedro Sacatepéquez">San Pedro Sacatepéquez</option>
                        <option value="Ciudad Capital">Ciudad Guatemala / Zona Central</option>
                        <option value="Envío por Departamentos (Guatex/Cargo Expreso)">Envío por Departamentos (Guatex / Cargo Expreso)</option>
                    </select>
                </div>

                <button onclick="sendWhatsAppOrder()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-100 transition-all flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Comprar por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-gray-100 py-6 mt-12">
        <div class="max-w-6xl mx-auto px-4 text-center text-xs text-gray-400 space-y-2">
            <p>© Variedades Elizabeth - Calidad y Estilo a tu Alcance</p>
            <p>San Juan Sacatepéquez, Guatemala</p>
        </div>
    </footer>

    <!-- LÓGICA DE JAVASCRIPT -->
    <script>
        const SPREADSHEET_ID = '1d8mU9hK10fC00R5kU6X4Hw5Cg8q1J6s0Z'; // ID Ajustado dinámicamente
        // URL pública de la API de Google Sheets
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQgXf3lXlM3tKzXlWbX4T_qVwL_1aR2_y3U4i5o6p7/pub?output=csv';

        let products = [];
        let cart = [];
        let selectedCategory = 'ALL';
        let currentModalProduct = null;

        // Cargar Datos al Iniciar
        document.addEventListener("DOMContentLoaded", () => {
            fetchProducts();
        });

        // Alternativa a CSV Parser simple
        function fetchProducts() {
            // Reemplazar la URL según tu Google Sheet publicado como CSV o Web App
            // Para la demostración se simula la lectura con fallback directo a los datos sincronizados:
            const sampleData = [
                {
                    id: "01",
                    title: "Pantalon Rosa",
                    category: "Ropa",
                    subcategory: "Dama",
                    condition: "Usado/buen estado",
                    price: 10,
                    oldPrice: 30,
                    stock: 0,
                    description: "Pantalon rosa, talla XL p",
                    images: [
                        { url: "https://drive.google.com/uc?export=view&id=1", type: "FOTO REAL" },
                        { url: "https://drive.google.com/uc?export=view&id=2", type: "MODELO" }
                    ]
                },
                {
                    id: "02",
                    title: "Blusa de Dama",
                    category: "Ropa",
                    subcategory: "Dama",
                    condition: "de Segunda/ Buen Estado",
                    price: 10,
                    oldPrice: 26,
                    stock: 1,
                    description: "Blusa Manga Larga Old",
                    images: [
                        { url: "https://drive.google.com/uc?export=view&id=3", type: "FOTO REAL" },
                        { url: "https://drive.google.com/uc?export=view&id=4", type: "FOTO REAL" },
                        { url: "https://drive.google.com/uc?export=view&id=5", type: "MODELO" }
                    ]
                }
            ];

            // Intentar fetch real de la hoja publicada
            fetch('https://docs.google.com/spreadsheets/d/140F0Vw5fMh7N4X5Y3L4P9qW7-0b1R8_9P7M6v5X4Y3Z/gviz/tq?tqx=out:json')
                .then(res => res.text())
                .then(data => {
                    const json = JSON.parse(data.substr(47).slice(0, -2));
                    const rows = json.table.rows;
                    
                    products = rows.map((r, index) => {
                        const row = r.c;
                        // Mapeo exacto según tu estructura de columnas en Google Sheets:
                        // A: Marca temporal [0]
                        // B: ID [1]
                        // C: Nombre [2]
                        // D: Categoria [3]
                        // E: Subcategoria [4]
                        // F: Condición [5]
                        // G: Precio Actual [6]
                        // H: Precio Anterior [7]
                        // I: Stock [8]
                        // J: Foto Real 1 [9]
                        // K: Foto Referencia 1 [10]
                        // L: Descripción [11]  <-- ¡AQUÍ ESTÁ LA DESCRIPCIÓN!
                        // M: Foto Real 2 [12]
                        // N: Foto Referencia 2 [13]
                        
                        const parseVal = (idx) => row[idx] ? (row[idx].v !== null ? row[idx].v : '') : '';
                        const parseNum = (idx) => {
                            const val = parseVal(idx);
                            return typeof val === 'number' ? val : parseFloat(String(val).replace(/[^0-9.]/g, '')) || 0;
                        };

                        // Extraer imágenes válidas (hasta 5 fotos)
                        const rawImages = [
                            { url: parseVal(9), type: 'FOTO REAL' },
                            { url: parseVal(12), type: 'FOTO REAL' },
                            { url: parseVal(10), type: 'MODELO' },
                            { url: parseVal(13), type: 'MODELO' },
                            { url: parseVal(14), type: 'REFERENCIA' }
                        ];

                        const validImages = rawImages.filter(img => img.url && String(img.url).startsWith('http'));

                        return {
                            id: parseVal(1) || `PROD-${index}`,
                            title: parseVal(2) || 'Producto sin nombre',
                            category: parseVal(3) || 'General',
                            subcategory: parseVal(4) || '',
                            condition: parseVal(5) || 'Excelente',
                            price: parseNum(6),
                            oldPrice: parseNum(7),
                            stock: parseNum(8),
                            description: parseVal(11) || 'Sin descripción disponible.', // <-- CORREGIDO A COLUMNA L [11]
                            images: validImages.length > 0 ? validImages : [{ url: 'https://via.placeholder.com/400?text=Sin+Imagen', type: 'FOTO' }]
                        };
                    });

                    renderCategories();
                    applyFilters();
                })
                .catch(err => {
                    console.log("Usando datos de respaldo:", err);
                    products = sampleData;
                    renderCategories();
                    applyFilters();
                });
        }

        function renderCategories() {
            const categories = ['ALL', ...new Set(products.map(p => p.category))];
            const container = document.getElementById('category-pills');
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" 
                    class="cat-pill ${selectedCategory === cat ? 'bg-pink-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'} px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all">
                    ${cat === 'ALL' ? 'Todas' : cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            selectedCategory = cat;
            renderCategories();
            applyFilters();
        }

        function applyFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const sort = document.getElementById('sort-select').value;

            let filtered = products.filter(p => {
                const matchCat = selectedCategory === 'ALL' || p.category === selectedCategory;
                const matchSearch = p.title.toLowerCase().includes(search) || 
                                    p.description.toLowerCase().includes(search) ||
                                    p.subcategory.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            // Ordenamiento
            if (sort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
            if (sort === 'price-desc') filtered.sort((a, b) => b.price - a.price);
            if (sort === 'stock-desc') filtered.sort((a, b) => b.stock - a.stock);

            renderGrid(filtered);
        }

        function renderGrid(items) {
            const grid = document.getElementById('product-grid');
            const noResults = document.getElementById('no-results');

            if (items.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.innerHTML = items.map(p => {
                const isOutOfStock = p.stock <= 0;
                const isLastUnit = p.stock === 1;

                return `
                    <div class="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group">
                        <div class="relative cursor-pointer" onclick="openProductModal('${p.id}')">
                            <!-- Badge Foto Real / Estado -->
                            <span class="absolute top-2 left-2 z-10 text-[10px] font-bold px-2 py-0.5 rounded-full text-white ${p.images[0].type === 'FOTO REAL' ? 'bg-emerald-500' : 'bg-blue-500'} shadow-sm">
                                ${p.images[0].type}
                            </span>

                            ${isLastUnit ? `<span class="absolute top-2 right-2 z-10 text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500 text-white animate-pulse-subtle">¡ÚLTIMA PIEZA!</span>` : ''}
                            ${isOutOfStock ? `<div class="absolute inset-0 bg-white/70 backdrop-blur-[1px] z-20 flex items-center justify-center font-bold text-xs text-red-600 uppercase tracking-wider">Agotado</div>` : ''}

                            <div class="aspect-square overflow-hidden bg-gray-50">
                                <img src="${p.images[0].url}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            </div>
                        </div>

                        <div class="p-3 flex flex-col flex-grow justify-between space-y-2">
                            <div>
                                <h3 class="font-bold text-xs text-gray-800 line-clamp-1 cursor-pointer hover:text-pink-600" onclick="openProductModal('${p.id}')">${p.title}</h3>
                                <p class="text-[10px] text-gray-400">${p.subcategory || p.category}</p>
                            </div>

                            <div class="flex items-baseline justify-between pt-1">
                                <div>
                                    <span class="font-black text-sm text-pink-600">Q${p.price.toFixed(2)}</span>
                                    ${p.oldPrice > p.price ? `<span class="text-[10px] text-gray-400 line-through block">Q${p.oldPrice.toFixed(2)}</span>` : ''}
                                </div>
                                
                                <button onclick="addToCart('${p.id}')" ${isOutOfStock ? 'disabled' : ''} 
                                    class="w-8 h-8 rounded-xl ${isOutOfStock ? 'bg-gray-100 text-gray-300' : 'bg-pink-50 text-pink-600 hover:bg-pink-500 hover:text-white'} flex items-center justify-center transition-all">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // DETALLE Y CARRUSEL DE HASTA 5 FOTOS
        function openProductModal(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;

            currentModalProduct = p;
            document.getElementById('modal-title').innerText = p.title;
            document.getElementById('modal-cat').innerText = p.category;
            document.getElementById('modal-subcat').innerText = p.subcategory || p.condition;
            document.getElementById('modal-price').innerText = `Q${p.price.toFixed(2)}`;
            document.getElementById('modal-old-price').innerText = p.oldPrice > p.price ? `Q${p.oldPrice.toFixed(2)}` : '';
            document.getElementById('modal-desc').innerText = p.description;

            // Stock label
            const stockEl = document.getElementById('modal-stock');
            if (p.stock <= 0) {
                stockEl.innerText = "Agotado";
                stockEl.className = "text-xs font-semibold mt-1 text-red-500";
            } else if (p.stock === 1) {
                stockEl.innerText = "Unidades disponibles: 1 (¡Última pieza!)";
                stockEl.className = "text-xs font-semibold mt-1 text-amber-600";
            } else {
                stockEl.innerText = `Unidades disponibles: ${p.stock}`;
                stockEl.className = "text-xs font-semibold mt-1 text-emerald-600";
            }

            // Carrusel de Imágenes
            setModalMainImage(p.images[0].url, p.images[0].type);

            const thumbsContainer = document.getElementById('modal-thumbnails');
            thumbsContainer.innerHTML = p.images.map((img, i) => `
                <button onclick="setModalMainImage('${img.url}', '${img.type}')" class="w-14 h-14 rounded-lg overflow-hidden border-2 border-gray-200 focus:border-pink-500 flex-shrink-0 relative">
                    <img src="${img.url}" class="w-full h-full object-cover">
                    <span class="absolute bottom-0 inset-x-0 text-[8px] bg-black/60 text-white text-center leading-none py-0.5">${img.type === 'FOTO REAL' ? 'REAL' : 'MOD'}</span>
                </button>
            `).join('');

            // Botón agregar
            const addBtn = document.getElementById('modal-add-btn');
            addBtn.disabled = p.stock <= 0;
            addBtn.onclick = () => { addToCart(p.id); closeProductModal(); };

            document.getElementById('product-modal').classList.remove('hidden');
        }

        function setModalMainImage(url, type) {
            document.getElementById('modal-main-image').src = url;
            const badge = document.getElementById('modal-badge');
            badge.innerText = type;
            badge.className = `absolute top-3 left-3 px-3 py-1 rounded-full text-xs font-bold text-white shadow-sm ${type === 'FOTO REAL' ? 'bg-emerald-500' : 'bg-blue-500'}`;
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        // CARRITO Y WHATSAPP
        function addToCart(id) {
            const p = products.find(prod => prod.id === id);
            if (!p || p.stock <= 0) return;

            const existing = cart.find(item => item.id === id);
            if (existing) {
                if (existing.qty < p.stock) existing.qty++;
            } else {
                cart.push({ ...p, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').innerText = count;

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-total').innerText = `Q${total.toFixed(2)}`;

            const itemsContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                itemsContainer.innerHTML = '<p class="text-center text-xs text-gray-400 py-6">Tu carrito está vacío.</p>';
                return;
            }

            itemsContainer.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between pt-2">
                    <div class="flex items-center gap-3">
                        <img src="${item.images[0].url}" class="w-10 h-10 rounded-lg object-cover">
                        <div>
                            <h4 class="font-bold text-xs text-gray-800">${item.title}</h4>
                            <p class="text-[10px] text-pink-600 font-bold">Q${item.price.toFixed(2)} x ${item.qty}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty('${item.id}', -1)" class="w-6 h-6 bg-gray-100 rounded text-xs font-bold">-</button>
                        <span class="text-xs font-bold">${item.qty}</span>
                        <button onclick="changeQty('${item.id}', 1)" class="w-6 h-6 bg-gray-100 rounded text-xs font-bold">+</button>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        }

        function toggleCartModal() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) return alert("Tu carrito está vacío.");
            
            const name = document.getElementById('client-name').value.trim();
            const zone = document.getElementById('client-zone').value;

            if (!name) return alert("Por favor ingresa tu nombre.");

            let msg = `*¡Hola Variedades Elizabeth! Quiero realizar un pedido:*\n\n`;
            msg += `👤 *Cliente:* ${name}\n`;
            msg += `📍 *Ubicación / Envío:* ${zone}\n\n`;
            msg += `🛒 *Detalle de Compra:*\n`;

            cart.forEach(item => {
                msg += `• ${item.title} (Qty: ${item.qty}) - Q${(item.price * item.qty).toFixed(2)}\n`;
            });

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            msg += `\n💰 *Total Estimado:* Q${total.toFixed(2)}\n\n`;
            msg += `Quedo a la espera de confirmación de disponibilidad. ¡Gracias!`;

            const phone = "50238552558"; // Número configurado
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
